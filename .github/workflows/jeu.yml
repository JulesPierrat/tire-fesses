# Vérifie chaque pull request et main. La mise en ligne est faite par Vercel,
# branché sur le dépôt (voir docs/TECHNIQUE.md).
name: Jeu

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: jeu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    # La même image que ./outils : mêmes versions de Node et de Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Types et tests de la logique
        run: npm run check
      - name: Tests dans le navigateur (fabrique aussi dist/)
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-navigateur
          path: test-results/
          retention-days: 7
