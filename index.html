<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tire-Fesses, un jeu en pixel art : reliez les stations d'un domaine skiable par des pistes et des remontées.">
<link rel="icon" href="data:,">
<title>Tire-Fesses</title>
</head>
<body>
<main id="jeu">
  <canvas id="ecran" role="img" aria-label="La carte des Chocards : la station en bas, le sommet en haut, les pistes et les remontées du domaine"></canvas>
  <aside id="panneau" aria-label="Le domaine">
    <header>
      <h1>Les Chocards</h1>
      <div class="boutons" role="group" aria-label="Phase">
        <button type="button" class="bouton" data-phase="jour" aria-pressed="true">Jour</button>
        <button type="button" class="bouton" data-phase="nuit" aria-pressed="false">Nuit</button>
      </div>
    </header>
    <div id="message" aria-live="polite">
      <p id="message-titre" hidden></p>
      <p id="message-texte"></p>
    </div>
    <div id="actions" class="actions"></div>
    <button type="button" class="bouton discret" id="recommencer">Recommencer la carte</button>
  </aside>
</main>
<div id="tourne"><p>Tournez votre téléphone pour jouer.</p></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
